[mypy]
# Baseline: mypy's default (non-strict) checks over all of src/finn. Functions
# without annotations are not checked; annotate code to have it checked.
python_version = 3.12
files = src/finn
# finn is a namespace package (no __init__.py): module names start at src/
mypy_path = src
explicit_package_bases = True
# not a valid package name (hyphen), mypy aborts on it
exclude = ^src/finn/qnn-data/
# third-party packages are not installed in the pre-commit environment
ignore_missing_imports = True
warn_unused_configs = True

# Ratchet: fully annotated modules, checked strictly. A module joins this list
# once its annotations are complete (new modules start on it) and never leaves.
[mypy-finn.analysis.*,finn.core.*,finn.xsi.*,finn.transformation.fpgadataflow.fifo_sizing.tree_models.pwpolyf]
disallow_untyped_defs = True
check_untyped_defs = True
