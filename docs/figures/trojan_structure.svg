<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <linearGradient id="benign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="trojan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdecea"/>
      <stop offset="100%" stop-color="#f5d0cc"/>
    </linearGradient>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">
    Hardware Trojan Structure (Final MVAU Layer)
  </text>
  <text x="460" y="48" text-anchor="middle" font-size="11" fill="#666">
    Every inference passes through the trigger; only the payload is conditional
  </text>

  <!-- Panel A -->
  <rect x="24" y="64" width="872" height="110" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="40" y="84" font-size="12" font-weight="bold" fill="#333">A. High-level placement</text>

  <rect x="40" y="96" width="80" height="44" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="80" y="122" text-anchor="middle" font-size="10" font-weight="bold">Input</text>

  <line x1="120" y1="118" x2="148" y2="118" stroke="#555" marker-end="url(#arr)"/>

  <rect x="148" y="88" width="150" height="64" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="223" y="110" text-anchor="middle" font-size="10" font-weight="bold">Final MVAU compute</text>
  <text x="223" y="126" text-anchor="middle" font-size="8.5" fill="#666">benign: matmul + activation</text>
  <text x="223" y="140" text-anchor="middle" font-size="8.5" fill="#666">weights unchanged</text>

  <line x1="298" y1="118" x2="326" y2="118" stroke="#555" marker-end="url(#arr)"/>

  <rect x="326" y="88" width="210" height="64" rx="8" fill="url(#trojan)" stroke="#c0392b" stroke-width="2"/>
  <text x="431" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#922b21">Trojan logic</text>
  <text x="431" y="126" text-anchor="middle" font-size="8.5" fill="#555">inside final MVAU IP</text>
  <text x="431" y="140" text-anchor="middle" font-size="8.5" fill="#555">trigger always + payload if enabled</text>

  <line x1="536" y1="118" x2="564" y2="118" stroke="#555" marker-end="url(#arr)"/>
  <text x="550" y="110" text-anchor="middle" font-size="8" fill="#888">logits</text>

  <rect x="564" y="96" width="80" height="44" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="604" y="116" text-anchor="middle" font-size="10" font-weight="bold">Output</text>
  <text x="604" y="130" text-anchor="middle" font-size="8" fill="#666">stream</text>

  <line x1="644" y1="118" x2="672" y2="118" stroke="#555" marker-end="url(#arr)"/>

  <rect x="672" y="96" width="80" height="44" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="712" y="122" text-anchor="middle" font-size="10" font-weight="bold">Argmax</text>

  <!-- Panel B title -->
  <rect x="24" y="188" width="872" height="330" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="40" y="210" font-size="12" font-weight="bold" fill="#922b21">B. Execution flow (every inference)</text>
  <text x="40" y="226" font-size="9.5" fill="#666">Solid arrows = always executed. Dashed arrow = skip payload modification only (logits stay unchanged).</text>

  <!-- Main flow row -->
  <rect x="40" y="244" width="100" height="56" rx="6" fill="#f5f5f5" stroke="#888"/>
  <text x="90" y="266" text-anchor="middle" font-size="10" font-weight="bold">Logit buffer</text>
  <text x="90" y="282" text-anchor="middle" font-size="8.5" fill="#666">MH class scores</text>

  <line x1="140" y1="272" x2="168" y2="272" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="154" y="264" text-anchor="middle" font-size="8" fill="#444">always</text>

  <rect x="168" y="238" width="120" height="68" rx="6" fill="url(#trojan)" stroke="#c0392b" stroke-width="1.8"/>
  <text x="228" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#922b21">Trigger unit</text>
  <text x="228" y="276" text-anchor="middle" font-size="8.5" fill="#555">counter + T0/T1</text>
  <text x="228" y="292" text-anchor="middle" font-size="8" fill="#922b21">ALWAYS RUNS</text>

  <line x1="288" y1="272" x2="316" y2="272" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <polygon points="336,272 358,286 336,300 314,286" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="336" y="283" text-anchor="middle" font-size="8" font-weight="bold">do_payload?</text>
  <text x="336" y="293" text-anchor="middle" font-size="7" fill="#555">from trigger</text>

  <!-- YES branch up to payload -->
  <line x1="358" y1="278" x2="400" y2="256" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="252" font-size="9" font-weight="bold" fill="#922b21">YES</text>

  <rect x="400" y="232" width="200" height="52" rx="6" fill="url(#trojan)" stroke="#c0392b" stroke-width="1.8"/>
  <text x="500" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#922b21">Payload unit</text>
  <text x="500" y="268" text-anchor="middle" font-size="8.5" fill="#555">force / swap / demote on logits[]</text>

  <line x1="500" y1="284" x2="500" y2="318" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NO branch down bypass payload -->
  <line x1="358" y1="294" x2="400" y2="318" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="372" y="314" font-size="9" font-weight="bold" fill="#888">NO</text>
  <text x="430" y="314" font-size="8.5" fill="#888">skip payload</text>

  <!-- Merge + repack -->
  <rect x="420" y="318" width="160" height="44" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="500" y="338" text-anchor="middle" font-size="10" font-weight="bold">Merge + repack</text>
  <text x="500" y="354" text-anchor="middle" font-size="8.5" fill="#666">always runs (both branches)</text>

  <line x1="580" y1="340" x2="608" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="608" y="318" width="120" height="44" rx="6" fill="#f5f5f5" stroke="#888"/>
  <text x="668" y="338" text-anchor="middle" font-size="10" font-weight="bold">Output logits</text>
  <text x="668" y="354" text-anchor="middle" font-size="8.5" fill="#666">changed or unchanged</text>

  <!-- Connect logit buffer path to merge vertically for NO case clarity -->
  <path d="M 314 286 L 280 286 L 280 340 L 420 340" fill="none" stroke="#eee" stroke-width="1"/>

  <!-- Trigger details box -->
  <rect x="40" y="378" width="400" height="120" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="56" y="398" font-size="10" font-weight="bold" fill="#333">Trigger unit (detail)</text>

  <rect x="56" y="410" width="110" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="111" y="428" text-anchor="middle" font-size="9" font-weight="bold">Inference counter</text>
  <text x="111" y="444" text-anchor="middle" font-size="8" fill="#555">increments every inference</text>

  <rect x="178" y="410" width="110" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="233" y="428" text-anchor="middle" font-size="9" font-weight="bold">T0 Periodic</text>
  <text x="233" y="444" text-anchor="middle" font-size="8" fill="#555">fire every N inferences</text>

  <rect x="300" y="410" width="120" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="360" y="428" text-anchor="middle" font-size="9" font-weight="bold">T1 Persistent</text>
  <text x="360" y="444" text-anchor="middle" font-size="8" fill="#555">latch at N, then always on</text>

  <text x="56" y="478" font-size="9" fill="#444">Output of trigger unit: do_payload signal (1 = apply payload, 0 = skip payload)</text>
  <text x="56" y="492" font-size="9" fill="#444">Counter still updates even when do_payload = 0</text>

  <!-- Payload details box -->
  <rect x="460" y="378" width="436" height="120" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="476" y="398" font-size="10" font-weight="bold" fill="#333">Payload unit (detail, only when do_payload = 1)</text>

  <rect x="476" y="410" width="80" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="516" y="436" text-anchor="middle" font-size="9" font-weight="bold">Force</text>

  <rect x="566" y="410" width="80" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="606" y="436" text-anchor="middle" font-size="9" font-weight="bold">Swap</text>

  <rect x="656" y="410" width="80" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="696" y="436" text-anchor="middle" font-size="9" font-weight="bold">Demote</text>

  <rect x="746" y="410" width="134" height="44" rx="4" fill="#fff" stroke="#aaa"/>
  <text x="813" y="428" text-anchor="middle" font-size="8.5" fill="#555">One mode per bitstream</text>
  <text x="813" y="444" text-anchor="middle" font-size="8.5" fill="#555">target class at compile time</text>

  <text x="476" y="478" font-size="9" fill="#444">When do_payload = 0: this entire block is skipped; logits in buffer are not modified</text>
  <text x="476" y="492" font-size="9" fill="#444">When do_payload = 1: selected logits are modified, then repacked to output stream</text>

  <!-- Panel C -->
  <rect x="24" y="530" width="872" height="72" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="40" y="550" font-size="12" font-weight="bold" fill="#333">C. Runtime summary</text>

  <rect x="40" y="560" width="270" height="32" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="175" y="580" text-anchor="middle" font-size="9" fill="#444">Trigger logic executes on every inference</text>

  <rect x="325" y="560" width="270" height="32" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="460" y="580" text-anchor="middle" font-size="9" fill="#444">Payload runs only when do_payload = 1</text>

  <rect x="610" y="560" width="270" height="32" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="745" y="580" text-anchor="middle" font-size="9" fill="#444">Repack always runs; output may match clean model when inactive</text>

  <!-- Legend -->
  <rect x="760" y="72" width="14" height="14" fill="url(#trojan)" stroke="#c0392b"/>
  <text x="780" y="83" font-size="9" fill="#444">Trojan logic</text>
  <rect x="760" y="92" width="14" height="14" fill="url(#benign)" stroke="#888"/>
  <text x="780" y="103" font-size="9" fill="#444">Benign compute</text>
  <line x1="760" y1="118" x2="774" y2="118" stroke="#aaa" stroke-dasharray="4,3"/>
  <text x="780" y="122" font-size="9" fill="#444">Payload bypass (not trigger bypass)</text>
</svg>
