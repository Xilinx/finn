<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <linearGradient id="benign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="trojan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdecea"/>
      <stop offset="100%" stop-color="#f5d0cc"/>
    </linearGradient>
    <linearGradient id="layerBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e8f1fa"/>
    </linearGradient>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">
    Trojan Location inside the Final MVAU Layer
  </text>
  <text x="460" y="48" text-anchor="middle" font-size="11" fill="#666">
    The trojan is part of the final layer hardware module, not a separate network layer
  </text>

  <!-- Earlier layers -->
  <rect x="24" y="88" width="140" height="56" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="94" y="112" text-anchor="middle" font-size="11" font-weight="bold">Input</text>
  <text x="94" y="130" text-anchor="middle" font-size="9" fill="#666">features</text>

  <line x1="164" y1="116" x2="194" y2="116" stroke="#555" marker-end="url(#arr)"/>

  <rect x="194" y="80" width="170" height="72" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="279" y="104" text-anchor="middle" font-size="11" font-weight="bold">Earlier layers</text>
  <text x="279" y="122" text-anchor="middle" font-size="9" fill="#666">hidden MVAU layers</text>
  <text x="279" y="138" text-anchor="middle" font-size="9" fill="#666">unchanged, no trojan</text>

  <line x1="364" y1="116" x2="394" y2="116" stroke="#555" marker-end="url(#arr)"/>

  <!-- Final MVAU layer - main container -->
  <rect x="394" y="68" width="502" height="280" rx="10" fill="url(#layerBox)" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="410" y="92" font-size="13" font-weight="bold" fill="#1f4e79">Final MVAU layer (output layer)</text>
  <text x="410" y="108" font-size="9.5" fill="#555">Single hardware IP block generated by FINN for the last matrix-vector layer</text>

  <!-- Inside: benign compute -->
  <rect x="414" y="128" width="168" height="88" rx="6" fill="url(#benign)" stroke="#888" stroke-width="1.5"/>
  <text x="498" y="152" text-anchor="middle" font-size="11" font-weight="bold">Benign compute</text>
  <text x="498" y="172" text-anchor="middle" font-size="9.5" fill="#555">Matrix-vector multiply</text>
  <text x="498" y="188" text-anchor="middle" font-size="9.5" fill="#555">+ activation / thresholds</text>
  <text x="498" y="206" text-anchor="middle" font-size="8.5" fill="#777">trained weights (unchanged)</text>

  <line x1="582" y1="172" x2="626" y2="178" stroke="#555" marker-end="url(#arr)"/>

  <!-- Internal buffer + trojan flow -->
  <rect x="612" y="124" width="268" height="156" rx="8" fill="url(#trojan)" stroke="#c0392b" stroke-width="2"/>
  <text x="746" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#922b21">Trojan logic (runs every inference)</text>

  <rect x="626" y="156" width="88" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="670" y="174" text-anchor="middle" font-size="9" font-weight="bold">Logit buffer</text>
  <text x="670" y="190" text-anchor="middle" font-size="7.5" fill="#555">unpacked scores</text>

  <line x1="714" y1="178" x2="734" y2="178" stroke="#555" marker-end="url(#arr)"/>

  <rect x="734" y="156" width="72" height="44" rx="4" fill="#fff" stroke="#c0392b"/>
  <text x="770" y="174" text-anchor="middle" font-size="9" font-weight="bold">Trigger</text>
  <text x="770" y="190" text-anchor="middle" font-size="7.5" fill="#555">always runs</text>

  <line x1="806" y1="178" x2="826" y2="178" stroke="#555" marker-end="url(#arr)"/>

  <polygon points="842,178 862,190 842,202 822,190" fill="#fff" stroke="#666"/>
  <text x="842" y="193" text-anchor="middle" font-size="7" font-weight="bold">do_payload?</text>

  <line x1="626" y1="214" x2="626" y2="232" stroke="#555"/>
  <line x1="842" y1="202" x2="842" y2="232" stroke="#555" marker-end="url(#arr)"/>

  <line x1="842" y1="214" x2="870" y2="214" stroke="#555" marker-end="url(#arr)"/>
  <text x="854" y="206" font-size="7.5" fill="#922b21">yes</text>
  <rect x="870" y="200" width="78" height="32" rx="4" fill="#fff" stroke="#c0392b"/>
  <text x="909" y="220" text-anchor="middle" font-size="8.5" font-weight="bold">Payload</text>

  <line x1="822" y1="190" x2="790" y2="248" stroke="#aaa" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="796" y="228" font-size="7.5" fill="#888">no: skip payload</text>

  <rect x="626" y="244" width="240" height="28" rx="4" fill="#fff" stroke="#888"/>
  <text x="746" y="262" text-anchor="middle" font-size="8.5" fill="#555">Repack logits to output stream (always)</text>

  <line x1="746" y1="280" x2="746" y2="378" stroke="#555" marker-end="url(#arr)"/>
  <text x="758" y="330" font-size="9" fill="#888">layer output</text>

  <!-- Downstream -->

  <rect x="656" y="378" width="140" height="48" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="726" y="400" text-anchor="middle" font-size="11" font-weight="bold">Layer output</text>
  <text x="726" y="416" text-anchor="middle" font-size="9" fill="#666">class logits</text>

  <line x1="796" y1="402" x2="826" y2="402" stroke="#555" marker-end="url(#arr)"/>

  <rect x="826" y="378" width="100" height="48" rx="6" fill="url(#benign)" stroke="#888"/>
  <text x="876" y="400" text-anchor="middle" font-size="11" font-weight="bold">Argmax</text>
  <text x="876" y="416" text-anchor="middle" font-size="9" fill="#666">predicted class</text>

  <!-- Callout bracket for trojan location -->
  <path d="M 404 230 L 384 230 L 384 310 L 404 310" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="24" y="252" font-size="10" font-weight="bold" fill="#922b21">Trojan sits here</text>
  <text x="24" y="268" font-size="9" fill="#555">inside the final MVAU IP,</text>
  <text x="24" y="282" font-size="9" fill="#555">after benign compute,</text>
  <text x="24" y="296" font-size="9" fill="#555">before layer output</text>

  <!-- Legend -->
  <rect x="24" y="368" width="320" height="88" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="40" y="390" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <rect x="40" y="402" width="14" height="14" fill="url(#layerBox)" stroke="#1f4e79"/>
  <text x="60" y="413" font-size="9" fill="#444">Final MVAU layer (one FINN hardware module)</text>
  <rect x="40" y="422" width="14" height="14" fill="url(#benign)" stroke="#888"/>
  <text x="60" y="433" font-size="9" fill="#444">Benign compute (standard FINN logic)</text>
  <rect x="40" y="442" width="14" height="14" fill="url(#trojan)" stroke="#c0392b"/>
  <text x="60" y="453" font-size="9" fill="#444">Malicious logic (compiler-inserted)</text>

  <!-- Key message -->
  <rect x="24" y="468" width="872" height="40" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="460" y="492" text-anchor="middle" font-size="10" fill="#444">
    Trigger always runs; payload is skipped when do_payload=0. Logits may be unchanged but still repacked.
  </text>
</svg>
